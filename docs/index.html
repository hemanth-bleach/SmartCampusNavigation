<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Navigation System - Live Demo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --card-bg: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --teal: #14b8a6;
            --teal-hover: #2dd4bf;
            --gold: #f59e0b;
            --red: #ef4444;
            --green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #0b1120;
            border-bottom: 1px solid #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 1.35rem;
            color: var(--text-primary);
        }

        .header-title p {
            font-size: 0.85rem;
            color: var(--teal);
        }

        .download-btn {
            background: linear-gradient(135deg, var(--teal), #0d9488);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.25);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(20, 184, 166, 0.4);
        }

        .main-layout {
            display: flex;
            flex: 1;
            padding: 1.5rem;
            gap: 1.5rem;
        }

        .sidebar {
            width: 360px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            border: 1px solid #334155;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid #475569;
            padding: 0.7rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus {
            border-color: var(--teal);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid #475569;
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #475569;
            border-color: var(--teal);
        }

        .output-box {
            background-color: var(--bg-color);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem;
            flex: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.88rem;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .map-card {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background-color: #0b1120;
        }

        .legend {
            position: absolute;
            bottom: 25px;
            left: 25px;
            background-color: rgba(15, 23, 42, 0.92);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .map-card {
                min-height: 480px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>Smart Campus Navigation System</h1>
            <p>Live Web Simulator & Visualization (Java + DSA Project)</p>
        </div>
        <a href="https://github.com/hemanth-bleach/SmartCampusNavigation" class="download-btn" target="_blank">
            ⭐ View on GitHub
        </a>
    </header>

    <div class="main-layout">
        <div class="sidebar">
            <div class="form-group">
                <label for="srcSelect">Start Location</label>
                <select id="srcSelect"></select>
            </div>

            <div class="form-group">
                <label for="destSelect">Destination</label>
                <select id="destSelect"></select>
            </div>

            <div class="btn-group">
                <button onclick="runBFS()">Check Route (BFS)</button>
                <button onclick="runDFS()">Reachable (DFS)</button>
            </div>

            <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
                <label>Route Directions & Metrics</label>
                <div id="outputBox" class="output-box">Select buildings to calculate shortest path...</div>
            </div>
        </div>

        <div class="map-card">
            <canvas id="mapCanvas" width="900" height="550"></canvas>
            <div class="legend">
                <div style="font-weight: bold; margin-bottom: 2px;">MAP LEGEND</div>
                <div class="legend-item"><span class="dot" style="background: var(--green);"></span> Start Building</div>
                <div class="legend-item"><span class="dot" style="background: var(--red);"></span> Destination Building</div>
                <div class="legend-item"><span class="dot" style="background: var(--gold);"></span> Shortest Route</div>
                <div class="legend-item"><span class="dot" style="background: var(--teal);"></span> Alternative Route</div>
            </div>
        </div>
    </div>

    <script>
        const buildings = [
            { id: "LIB", name: "Library", x: 150, y: 150 },
            { id: "CSE", name: "Computer Science", x: 150, y: 400 },
            { id: "ADM", name: "Admin Block", x: 380, y: 150 },
            { id: "PKG", name: "Parking", x: 380, y: 400 },
            { id: "HST", name: "Hostel", x: 620, y: 150 },
            { id: "CNT", name: "Canteen", x: 620, y: 400 },
            { id: "AUD", name: "Auditorium", x: 800, y: 275 }
        ];

        const roads = [
            { u: "LIB", v: "CSE", dist: 100, blocked: false },
            { u: "LIB", v: "ADM", dist: 70, blocked: false },
            { u: "ADM", v: "PKG", dist: 50, blocked: false },
            { u: "LIB", v: "CNT", dist: 60, blocked: false },
            { u: "CSE", v: "CNT", dist: 200, blocked: false },
            { u: "ADM", v: "HST", dist: 80, blocked: false },
            { u: "HST", v: "CNT", dist: 40, blocked: false },
            { u: "CNT", v: "AUD", dist: 120, blocked: false },
            { u: "PKG", v: "AUD", dist: 90, blocked: false },
            { u: "HST", v: "AUD", dist: 110, blocked: false }
        ];

        let selectedSrc = "LIB";
        let selectedDest = "PKG";
        let primaryPath = [];
        let altPath = [];

        const srcSelect = document.getElementById("srcSelect");
        const destSelect = document.getElementById("destSelect");
        const outputBox = document.getElementById("outputBox");
        const canvas = document.getElementById("mapCanvas");
        const ctx = canvas.getContext("2d");

        function init() {
            buildings.forEach(b => {
                const opt1 = new Option(`${b.name} (${b.id})`, b.id);
                const opt2 = new Option(`${b.name} (${b.id})`, b.id);
                srcSelect.add(opt1);
                destSelect.add(opt2);
            });

            srcSelect.value = selectedSrc;
            destSelect.value = selectedDest;

            srcSelect.addEventListener("change", e => {
                selectedSrc = e.target.value;
                calculateRoute();
            });

            destSelect.addEventListener("change", e => {
                selectedDest = e.target.value;
                calculateRoute();
            });

            canvas.addEventListener("click", handleCanvasClick);
            canvas.addEventListener("contextmenu", e => {
                e.preventDefault();
                handleCanvasClick(e, true);
            });

            calculateRoute();
        }

        function handleCanvasClick(e, isRightClick = false) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            for (const b of buildings) {
                const dist = Math.hypot(b.x - clickX, b.y - clickY);
                if (dist <= 22) {
                    if (isRightClick) {
                        selectedDest = b.id;
                        destSelect.value = b.id;
                    } else {
                        selectedSrc = b.id;
                        srcSelect.value = b.id;
                    }
                    calculateRoute();
                    break;
                }
            }
        }

        function dijkstra(srcId, destId, excludeEdge = null) {
            const dist = {};
            const prev = {};
            const visited = new Set();
            const pq = [];

            buildings.forEach(b => dist[b.id] = Infinity);
            dist[srcId] = 0;
            pq.push({ id: srcId, dist: 0 });

            while (pq.length > 0) {
                pq.sort((a, b) => a.dist - b.dist);
                const current = pq.shift();
                if (visited.has(current.id)) continue;
                visited.add(current.id);

                if (current.id === destId) break;

                // get neighbors
                roads.forEach(r => {
                    if (r.blocked) return;
                    if (excludeEdge && 
                        ((r.u === excludeEdge.u && r.v === excludeEdge.v) || 
                         (r.u === excludeEdge.v && r.v === excludeEdge.u))) {
                        return;
                    }

                    let neighbor = null;
                    if (r.u === current.id) neighbor = r.v;
                    else if (r.v === current.id) neighbor = r.u;

                    if (neighbor && !visited.has(neighbor)) {
                        const newDist = dist[current.id] + r.dist;
                        if (newDist < dist[neighbor]) {
                            dist[neighbor] = newDist;
                            prev[neighbor] = current.id;
                            pq.push({ id: neighbor, dist: newDist });
                        }
                    }
                });
            }

            if (dist[destId] === Infinity) return null;

            const path = [];
            let curr = destId;
            while (curr) {
                path.unshift(curr);
                curr = prev[curr];
            }
            return { path, distance: dist[destId] };
        }

        function calculateRoute() {
            if (selectedSrc === selectedDest) {
                primaryPath = [selectedSrc];
                altPath = [];
                outputBox.innerText = `Source and destination are identical:\n${getName(selectedSrc)}`;
                draw();
                return;
            }

            const primary = dijkstra(selectedSrc, selectedDest);
            if (!primary) {
                primaryPath = [];
                altPath = [];
                outputBox.innerText = `NO ROUTE FOUND\n\nNo accessible roads between ${getName(selectedSrc)} and ${getName(selectedDest)}.`;
                draw();
                return;
            }

            primaryPath = primary.path;

            // Calculate Alternative Route (Yen's Heuristic)
            let bestAlt = null;
            let minAltDist = Infinity;

            for (let i = 0; i < primary.path.length - 1; i++) {
                const u = primary.path[i];
                const v = primary.path[i + 1];
                const alt = dijkstra(selectedSrc, selectedDest, { u, v });
                if (alt && alt.distance < minAltDist) {
                    minAltDist = alt.distance;
                    bestAlt = alt;
                }
            }

            altPath = bestAlt ? bestAlt.path : [];

            const walkingSeconds = Math.round(primary.distance / 1.4);
            const minutes = Math.floor(walkingSeconds / 60);
            const seconds = walkingSeconds % 60;
            const timeStr = minutes > 0 ? `${minutes} min ${seconds} sec` : `${seconds} sec`;

            let report = `=== SHORTEST ROUTE ===\n`;
            report += primary.path.map(id => getName(id)).join(" ➔ ");
            report += `\nTotal Distance: ${primary.distance.toFixed(1)}m`;
            report += `\nWalking Time (@1.4m/s): ${timeStr}\n\n`;

            if (bestAlt) {
                const altSeconds = Math.round(bestAlt.distance / 1.4);
                const altMins = Math.floor(altSeconds / 60);
                const altSecs = altSeconds % 60;
                report += `=== SECOND BEST ROUTE ===\n`;
                report += bestAlt.path.map(id => getName(id)).join(" ➔ ");
                report += `\nDistance: ${bestAlt.distance.toFixed(1)}m`;
                report += `\nTime: ${altMins > 0 ? `${altMins} min ${altSecs} sec` : `${altSecs} sec`}`;
            } else {
                report += `=== SECOND BEST ROUTE ===\nNo alternative route available.`;
            }

            outputBox.innerText = report;
            draw();
        }

        function runBFS() {
            const queue = [selectedSrc];
            const visited = new Set([selectedSrc]);
            let reachable = false;

            while (queue.length > 0) {
                const curr = queue.shift();
                if (curr === selectedDest) {
                    reachable = true;
                    break;
                }
                roads.forEach(r => {
                    if (r.blocked) return;
                    let neighbor = null;
                    if (r.u === curr) neighbor = r.v;
                    else if (r.v === curr) neighbor = r.u;

                    if (neighbor && !visited.has(neighbor)) {
                        visited.add(neighbor);
                        queue.push(neighbor);
                    }
                });
            }

            alert(reachable 
                ? `BFS Verification: Route EXISTS between ${getName(selectedSrc)} and ${getName(selectedDest)}!` 
                : `BFS Verification: Route is DISCONNECTED.`);
        }

        function runDFS() {
            const visited = new Set();
            const order = [];

            function dfs(node) {
                visited.add(node);
                order.push(getName(node));
                roads.forEach(r => {
                    if (r.blocked) return;
                    let neighbor = null;
                    if (r.u === node) neighbor = r.v;
                    else if (r.v === node) neighbor = r.u;

                    if (neighbor && !visited.has(neighbor)) {
                        dfs(neighbor);
                    }
                });
            }

            dfs(selectedSrc);
            alert(`DFS Reachable Buildings from ${getName(selectedSrc)}:\n\n` + order.join(" ➔ "));
        }

        function getName(id) {
            const b = buildings.find(x => x.id === id);
            return b ? b.name : id;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = "rgba(40, 50, 70, 0.4)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw roads
            roads.forEach(r => {
                const u = buildings.find(b => b.id === r.u);
                const v = buildings.find(b => b.id === r.v);
                if (!u || !v) return;

                ctx.beginPath();
                ctx.moveTo(u.x, u.y);
                ctx.lineTo(v.x, v.y);

                if (r.blocked) {
                    ctx.strokeStyle = "#ef4444";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                } else {
                    ctx.strokeStyle = "#64748b";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([]);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw distance text
                const midX = (u.x + v.x) / 2;
                const midY = (u.y + v.y) / 2;
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(midX - 18, midY - 9, 36, 18);
                ctx.fillStyle = "#94a3b8";
                ctx.font = "11px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(`${r.dist}m`, midX, midY);
            });

            // Draw alternative path
            if (altPath.length > 1) {
                ctx.strokeStyle = "rgba(20, 184, 166, 0.8)";
                ctx.lineWidth = 4;
                ctx.setLineDash([8, 4]);
                for (let i = 0; i < altPath.length - 1; i++) {
                    const u = buildings.find(b => b.id === altPath[i]);
                    const v = buildings.find(b => b.id === altPath[i + 1]);
                    ctx.beginPath();
                    ctx.moveTo(u.x, u.y);
                    ctx.lineTo(v.x, v.y);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }

            // Draw primary shortest path
            if (primaryPath.length > 1) {
                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 5;
                for (let i = 0; i < primaryPath.length - 1; i++) {
                    const u = buildings.find(b => b.id === primaryPath[i]);
                    const v = buildings.find(b => b.id === primaryPath[i + 1]);
                    ctx.beginPath();
                    ctx.moveTo(u.x, u.y);
                    ctx.lineTo(v.x, v.y);
                    ctx.stroke();
                }
            }

            // Draw buildings
            buildings.forEach(b => {
                let fill = "#334155";
                let stroke = "#14b8a6";

                if (b.id === selectedSrc) {
                    fill = "#22c55e";
                    stroke = "#ffffff";
                } else if (b.id === selectedDest) {
                    fill = "#ef4444";
                    stroke = "#ffffff";
                } else if (primaryPath.includes(b.id)) {
                    fill = "#f59e0b";
                    stroke = "#ffffff";
                }

                // Node circle
                ctx.beginPath();
                ctx.arc(b.x, b.y, 16, 0, Math.PI * 2);
                ctx.fillStyle = fill;
                ctx.fill();
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 3;
                ctx.stroke();

                // Building label
                ctx.font = "bold 12px 'Segoe UI'";
                const textWidth = ctx.measureText(b.name).width;
                ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
                ctx.fillRect(b.x - textWidth / 2 - 4, b.y + 20, textWidth + 8, 18);

                ctx.fillStyle = "#f8fafc";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(b.name, b.x, b.y + 29);
            });
        }

        init();
    </script>
</body>
</html>
